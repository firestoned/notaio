apiVersion: v1
kind: ServiceAccount
metadata:
  name: notaio
  namespace: notaio-system
---
# Cluster scope is read-only for the policy kinds, plus status writes and Events. Nothing here can
# create, update or delete a SandboxProfile, SandboxPolicy, KnobGrant or ExposureCeiling: those
# arrive through review and GitOps only (threat model T8.2).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: notaio
rules:
  - apiGroups: ["sandbox.firestoned.io"]
    resources: ["sandboxprofiles", "sandboxpolicies", "knobgrants"]
    verbs: ["get", "list", "watch"]
  # Approved exposure ceilings (ADR-0007): read only, and no status to write.
  - apiGroups: ["sandbox.firestoned.io"]
    resources: ["exposureceilings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sandbox.firestoned.io"]
    resources: ["sandboxprofiles/status", "sandboxpolicies/status", "knobgrants/status"]
    verbs: ["get", "patch"]
  # Needed when the OwnerReferencesPermissionEnforcement admission plugin is on, because the
  # published bundle carries an ownerReference with blockOwnerDeletion to its SandboxPolicy.
  - apiGroups: ["sandbox.firestoned.io"]
    resources: ["sandboxpolicies/finalizers"]
    verbs: ["update"]
  # Events on transitions (ADR-0010): create a new one, patch its count when it repeats. No read,
  # update or delete, and not the core group's events.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: notaio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: notaio
subjects:
  - kind: ServiceAccount
    name: notaio
    namespace: notaio-system
---
# Leader election (ADR-0011): the one Lease named notaio, in the controller's own namespace.
# Kubernetes cannot restrict `create` by name, so creating any Lease here is allowed; reading and
# renewing are limited to notaio's.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: notaio-leader
  namespace: notaio-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["notaio"]
    verbs: ["get", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: notaio-leader
  namespace: notaio-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: notaio-leader
subjects:
  - kind: ServiceAccount
    name: notaio
    namespace: notaio-system
