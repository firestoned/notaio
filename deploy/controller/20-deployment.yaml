apiVersion: apps/v1
kind: Deployment
metadata:
  name: notaio
  namespace: notaio-system
  labels:
    app.kubernetes.io/name: notaio
spec:
  # One replica until leader election lands (ROADMAP M2).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notaio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notaio
    spec:
      serviceAccountName: notaio
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notaio
          # `latest` follows main, for test clusters. A release pins this by digest in its install
          # manifest, notaio-<version>.yaml (ADR-0009); install from that, not from here.
          image: ghcr.io/firestoned/notaio:latest
          # Explicit, because a `latest` tag defaults to Always. The kind e2e suites swap in an
          # image side-loaded onto the node, which Always would try, and fail, to pull. A digest
          # is immutable, so IfNotPresent is also right for the release manifest.
          imagePullPolicy: IfNotPresent
          # One binary, the roles as subcommands (ADR-0006). Parsed by a test in crates/notaio/tests/cli.rs.
          args: ["controller"]
          # Health and metrics only (ADR-0010): GET /healthz, /readyz and /metrics, nothing else.
          # 30-networkpolicy.yaml admits it from the monitoring namespace only.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          env:
            # Names the replica in the Events it records.
            - name: NOTAIO_POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: RUST_LOG
              value: info
            - name: NOTAIO_LOG_JSON
              value: "1"
            - name: NOTAIO_BUNDLE_LIFETIME_SECONDS
              value: "3600"
            # The signer: a non-exportable OpenBao transit key (ADR-0004). notaio logs in with its
            # ServiceAccount (the projected token below) and may only request signatures. Point the
            # address at your OpenBao, and put the CA that signed its certificate in ConfigMap
            # openbao-ca (key ca.crt): it is the only root trusted. The pod does not start without
            # it. For a development seed instead, see deploy/signer/development-patch.yaml.
            - name: NOTAIO_OPENBAO_ADDR
              value: https://openbao.openbao.svc:8200
            - name: NOTAIO_OPENBAO_CA_FILE
              value: /var/run/notaio/openbao-ca/ca.crt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            - name: openbao-ca
              mountPath: /var/run/notaio/openbao-ca
              readOnly: true
      volumes:
        # For OpenBao's Kubernetes auth role notaio (audience openbao), rotated by the kubelet.
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: openbao
                  expirationSeconds: 3600
                  path: token
        - name: openbao-ca
          configMap:
            name: openbao-ca
