# Run the controller with the production signer, a non-exportable OpenBao transit key
# (ADR-0004). A strategic merge patch over deploy/controller/20-deployment.yaml:
#
#   kubectl -n notaio-system patch deployment notaio --type strategic \
#     --patch-file deploy/signer/openbao-patch.yaml
#
# It removes the development seed and its Secret mount (the controller refuses to start with
# both signers configured), and adds:
#   - the OpenBao address and the CA that signed its certificate, the only root trusted
#   - a projected ServiceAccount token with audience openbao, for Kubernetes auth
#
# Before applying, create ConfigMap openbao-ca in notaio-system with OpenBao's CA as ca.crt, and
# apply deploy/signer/openbao-networkpolicy.yaml. dev/openbao/use-signer.sh does all three.
# Replace the address with your OpenBao's.
spec:
  template:
    spec:
      containers:
        - name: notaio
          env:
            - name: NOTAIO_SIGNING_KEY_FILE
              $patch: delete
            - name: NOTAIO_KEY_ID
              $patch: delete
            - name: NOTAIO_OPENBAO_ADDR
              value: https://openbao.openbao.svc:8200
            - name: NOTAIO_OPENBAO_CA_FILE
              value: /var/run/notaio/openbao-ca/ca.crt
          volumeMounts:
            - mountPath: /var/run/notaio/signing
              $patch: delete
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            - name: openbao-ca
              mountPath: /var/run/notaio/openbao-ca
              readOnly: true
      volumes:
        - name: signing
          $patch: delete
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: openbao
                  expirationSeconds: 3600
                  path: token
        - name: openbao-ca
          configMap:
            name: openbao-ca
