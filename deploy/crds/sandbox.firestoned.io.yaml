---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxprofiles.sandbox.firestoned.io
spec:
  group: sandbox.firestoned.io
  names:
    kind: SandboxProfile
    plural: sandboxprofiles
    shortNames:
    - sbprofile
    singular: sandboxprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.dataScope
      name: Scope
      type: string
    - jsonPath: .status.conditions[?(@.type=="Valid")].status
      name: Valid
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SandboxProfileSpec via `CustomResource`
        properties:
          spec:
            description: |-
              A named bundle of knob steps (Fortress, Hardened, Standard, Lab). Cluster-scoped and
              platform-owned: teams pick a profile, they do not edit one.
            properties:
              dataScope:
                description: |-
                  `LabOnly` profiles hold no sensitive data, which is what allows them to combine untrusted
                  content with an open outbound channel.
                enum:
                - LabOnly
                - Internal
                type: string
              description:
                default: ""
                description: What the profile is for.
                type: string
              knobs:
                additionalProperties:
                  description: >-
                    A relaxation step for a knob. `R0` is the locked default; higher steps are
                    progressively looser.
                  enum:
                  - R0
                  - R1
                  - R2
                  - R3
                  type: string
                default: {}
                description: Step per knob id. A knob that is absent stays at R0, the locked default.
                type: object
            required:
            - dataScope
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: "`Valid`: whether the profile passes lint rules L001 to L004."
                items:
                  description: |-
                    A minimal condition type. Kept local so the CRD schema does not depend on the time
                    representation used by `k8s-openapi`.
                  properties:
                    lastTransitionTime:
                      description: When the status last changed.
                      format: date-time
                      type: string
                    message:
                      description: A human-readable explanation, with lint codes when findings caused it.
                      type: string
                    observedGeneration:
                      description: The object generation this condition was computed from.
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: The reason for the status, in CamelCase, such as `Published` or `SigningFailed`.
                      type: string
                    status:
                      description: "`True`, `False` or `Unknown`."
                      type: string
                    type:
                      description: "The condition: `Ready`, `Valid`, `ProfileResolved` or `Applied`, by kind."
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              digest:
                description: >-
                  Digest of the validated spec. Recorded in every bundle so a change to the
                  profile is visible.
                nullable: true
                type: string
              observedGeneration:
                description: The generation the status was computed from.
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: SandboxProfile
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxpolicies.sandbox.firestoned.io
spec:
  group: sandbox.firestoned.io
  names:
    kind: SandboxPolicy
    plural: sandboxpolicies
    shortNames:
    - sbpolicy
    singular: sandboxpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profileRef
      name: Profile
      type: string
    - jsonPath: .status.bundleVersion
      name: Version
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SandboxPolicySpec via `CustomResource`
        properties:
          spec:
            description: |-
              Binds subjects to a profile and adds the concrete audiences, egress entries and tools. The
              controller checks all of it against the profile's knob ceilings and compiles a signed bundle.
            properties:
              audiences:
                default: []
                description: Downstream services the sandbox may obtain tokens for.
                items:
                  description: One downstream audience the sandbox may obtain tokens for.
                  properties:
                    access:
                      default: Read
                      description: "`Read` or `Write`. `Write` needs K5.2 above R0 (lint L006)."
                      enum:
                      - Read
                      - Write
                      type: string
                    endpoints:
                      default: []
                      description: |-
                        Where the audience is reached, `host:port`, through the broker's proxy, which injects the
                        token: brokered calls, allowed at any K4.1 step. Exact names only (lint L017).
                      items:
                        type: string
                      type: array
                    name:
                      description: "The audience: the downstream service."
                      type: string
                    rules:
                      default: []
                      description: What may be called at those endpoints. None means every method and path.
                      items:
                        description: |-
                          One HTTP rule for an endpoint (ADR-0013): a method, or `*` for any, and a path glob in which `*`
                          matches one segment and `**` zero or more, matched against the path without the query. The
                          shape mediatore's egress proxy uses (its ADR-0025).
                        properties:
                          method:
                            description: An HTTP method, or `*`.
                            type: string
                          path:
                            description: A path glob starting with `/`.
                            type: string
                        required:
                        - method
                        - path
                        type: object
                      type: array
                    scopes:
                      default: []
                      description: Scopes requested for the token.
                      items:
                        type: string
                      type: array
                    ttlSeconds:
                      description: Requested token lifetime. Defaults to the K5.1 ceiling when omitted.
                      format: int64
                      minimum: 0.0
                      nullable: true
                      type: integer
                  required:
                  - name
                  type: object
                type: array
              budgets:
                description: Budgets. Defaults to the ceilings for the profile when omitted.
                nullable: true
                properties:
                  maxEgressBytes:
                    description: The most bytes of egress per lease.
                    format: int64
                    minimum: 0.0
                    type: integer
                  maxToolCalls:
                    description: The most tool calls per lease.
                    format: int64
                    minimum: 0.0
                    type: integer
                  maxWallClockSeconds:
                    description: The most wall-clock time per lease, in seconds.
                    format: int64
                    minimum: 0.0
                    type: integer
                required:
                - maxEgressBytes
                - maxToolCalls
                - maxWallClockSeconds
                type: object
              egress:
                default: []
                description: The egress allowlist.
                items:
                  description: |-
                    One direct egress entry: reached without the broker's proxy and without a token, enforced at
                    the gateway and in the host or network layer (ADR-0013).
                  properties:
                    endpoint:
                      description: "`host:port`, a DNS name. IP literals are refused; a wildcard host needs K4.1 R3 (lint L007)."
                      type: string
                    rules:
                      default: []
                      description: >-
                        What may be called there. Only accepted at K4.1 R2 and above. None means
                        anything.
                      items:
                        description: |-
                          One HTTP rule for an endpoint (ADR-0013): a method, or `*` for any, and a path glob in which `*`
                          matches one segment and `**` zero or more, matched against the path without the query. The
                          shape mediatore's egress proxy uses (its ADR-0025).
                        properties:
                          method:
                            description: An HTTP method, or `*`.
                            type: string
                          path:
                            description: A path glob starting with `/`.
                            type: string
                        required:
                        - method
                        - path
                        type: object
                      type: array
                  required:
                  - endpoint
                  type: object
                type: array
              lease:
                description: Lease limits. Defaults to the K7.3 ceiling for the profile when omitted.
                nullable: true
                properties:
                  maxConcurrent:
                    description: How many sandboxes one person may run at once.
                    format: int32
                    maximum: 255.0
                    minimum: 0.0
                    type: integer
                  maxDurationSeconds:
                    description: The longest a sandbox may run, in seconds.
                    format: int64
                    minimum: 0.0
                    type: integer
                required:
                - maxConcurrent
                - maxDurationSeconds
                type: object
              profileRef:
                description: Name of a cluster-scoped SandboxProfile.
                type: string
              subjects:
                default:
                  groups: []
                description: Who may claim a sandbox under this policy.
                properties:
                  groups:
                    default: []
                    description: Identity provider group ids allowed to claim a sandbox under this policy.
                    items:
                      type: string
                    type: array
                type: object
              tools:
                default: []
                description: Tools and MCP servers the agent may use.
                items:
                  description: A tool or MCP server the agent may use, pinned by manifest digest.
                  properties:
                    manifestDigest:
                      description: "`sha256:<hex>` of the tool manifest."
                      type: string
                    name:
                      description: The tool or MCP server's name.
                      type: string
                  required:
                  - manifestDigest
                  - name
                  type: object
                type: array
            required:
            - profileRef
            type: object
          status:
            nullable: true
            properties:
              activeGrants:
                default: []
                description: Names of the KnobGrants currently applied to this policy.
                items:
                  type: string
                type: array
              bundleDigest:
                description: "`sha256:<hex>` of the canonical bundle content."
                nullable: true
                type: string
              bundleNotAfter:
                description: When the published bundle stops being valid.
                format: date-time
                nullable: true
                type: string
              bundleVersion:
                description: Monotonic version of the compiled content. Bumps only when the content changes.
                format: int64
                minimum: 0.0
                nullable: true
                type: integer
              conditions:
                default: []
                description: "`Ready`, `Valid` and `ProfileResolved`."
                items:
                  description: |-
                    A minimal condition type. Kept local so the CRD schema does not depend on the time
                    representation used by `k8s-openapi`.
                  properties:
                    lastTransitionTime:
                      description: When the status last changed.
                      format: date-time
                      type: string
                    message:
                      description: A human-readable explanation, with lint codes when findings caused it.
                      type: string
                    observedGeneration:
                      description: The object generation this condition was computed from.
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: The reason for the status, in CamelCase, such as `Published` or `SigningFailed`.
                      type: string
                    status:
                      description: "`True`, `False` or `Unknown`."
                      type: string
                    type:
                      description: "The condition: `Ready`, `Valid`, `ProfileResolved` or `Applied`, by kind."
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              maxExposure:
                description: |-
                  What a fully compromised sandbox under this policy could reach (objective O3): computed, not
                  asserted.
                nullable: true
                properties:
                  audiences:
                    description: Every audience the sandbox can get a token for.
                    items:
                      description: One audience in the computed maximum exposure.
                      properties:
                        access:
                          description: "`Read` or `Write`."
                          enum:
                          - Read
                          - Write
                          type: string
                        endpoints:
                          default: []
                          description: Where the token can be used, `host:port`.
                          items:
                            type: string
                          type: array
                        name:
                          description: The audience.
                          type: string
                        ttlSeconds:
                          description: The token lifetime, in seconds.
                          format: int64
                          minimum: 0.0
                          type: integer
                      required:
                      - access
                      - name
                      - ttlSeconds
                      type: object
                    type: array
                  egressHosts:
                    description: Every `host:port` it can reach.
                    items:
                      type: string
                    type: array
                  leaseMaxSeconds:
                    description: The longest lease, in seconds.
                    format: int64
                    minimum: 0.0
                    type: integer
                  tools:
                    description: Every tool it can use.
                    items:
                      type: string
                    type: array
                  writeCapable:
                    description: Whether any audience grants `Write`.
                    type: boolean
                required:
                - audiences
                - egressHosts
                - leaseMaxSeconds
                - tools
                - writeCapable
                type: object
              nextGrantExpiry:
                description: The soonest expiry among the active grants.
                format: date-time
                nullable: true
                type: string
              observedGeneration:
                description: The generation the status was computed from.
                format: int64
                nullable: true
                type: integer
              profileDigest:
                description: Digest of the profile the bundle was built on.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: SandboxPolicy
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: knobgrants.sandbox.firestoned.io
spec:
  group: sandbox.firestoned.io
  names:
    kind: KnobGrant
    plural: knobgrants
    shortNames:
    - knobgrant
    singular: knobgrant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.policyRef
      name: Policy
      type: string
    - jsonPath: .spec.knob
      name: Knob
      type: string
    - jsonPath: .spec.step
      name: Step
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.expiresAt
      name: Expires
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KnobGrantSpec via `CustomResource`
        properties:
          spec:
            description: |-
              A time-boxed relaxation of one knob for one policy. Every relaxation has an owner, a reason, an
              approver and an expiry, so the knob dashboard is a query over this kind.
            properties:
              approvals:
                default: []
                description: One approval from every role the knob register names for this knob (lint L013).
                items:
                  description: |-
                    A recorded approval by a role named in the knob register. `reference` points at the reviewed
                    change (a pull request URL, for example), because policy changes only arrive through review.
                  properties:
                    reference:
                      description: "Where the approval was given: a link to the reviewed change."
                      type: string
                    role:
                      description: Approver roles named in the knob register.
                      enum:
                      - Security
                      - PlatformOwner
                      - DataOwner
                      - Compliance
                      - ToolOwner
                      - RiskOwner
                      type: string
                  required:
                  - reference
                  - role
                  type: object
                type: array
              expiresAt:
                description: When it ends. At most 90, 30 or 7 days away for R1, R2 or R3 (lint L012).
                format: date-time
                type: string
              knob:
                description: |-
                  Identifier of a knob in the register, for example `K4.1`. Validated against the registry by the
                  linter, not at deserialisation time, so an unknown id produces a finding instead of a parse error.
                type: string
              owner:
                description: The team or person accountable for the relaxation.
                type: string
              policyRef:
                description: SandboxPolicy in the same namespace.
                type: string
              reason:
                description: Why it is needed, for whoever reviews the relaxation dashboard.
                type: string
              step:
                description: Target step. Must be exactly one step above the profile's step for this knob.
                enum:
                - R0
                - R1
                - R2
                - R3
                type: string
            required:
            - expiresAt
            - knob
            - owner
            - policyRef
            - reason
            - step
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: "`Applied`: whether the grant is applied, with the findings when it is not."
                items:
                  description: |-
                    A minimal condition type. Kept local so the CRD schema does not depend on the time
                    representation used by `k8s-openapi`.
                  properties:
                    lastTransitionTime:
                      description: When the status last changed.
                      format: date-time
                      type: string
                    message:
                      description: A human-readable explanation, with lint codes when findings caused it.
                      type: string
                    observedGeneration:
                      description: The object generation this condition was computed from.
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: The reason for the status, in CamelCase, such as `Published` or `SigningFailed`.
                      type: string
                    status:
                      description: "`True`, `False` or `Unknown`."
                      type: string
                    type:
                      description: "The condition: `Ready`, `Valid`, `ProfileResolved` or `Applied`, by kind."
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: The generation the status was computed from.
                format: int64
                nullable: true
                type: integer
              phase:
                default: Pending
                description: "`Pending`, `Active`, `Rejected` or `Expired`."
                enum:
                - Pending
                - Active
                - Rejected
                - Expired
                type: string
            type: object
        required:
        - spec
        title: KnobGrant
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: exposureceilings.sandbox.firestoned.io
spec:
  group: sandbox.firestoned.io
  names:
    kind: ExposureCeiling
    plural: exposureceilings
    shortNames:
    - exposureceiling
    singular: exposureceiling
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.maxLeaseSeconds
      name: Lease
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ExposureCeilingSpec via `CustomResource`
        properties:
          spec:
            description: |-
              The approved maximum exposure of the SandboxPolicy with the same name and namespace
              (ADR-0007). A policy whose computed `status.maxExposure` this does not cover publishes no
              bundle, and neither does a policy without one. Changes only through review and GitOps, like
              the other kinds; the controller reads it and never writes it.
            properties:
              approvals:
                description: Must include one from the `Security` role (lint L016).
                items:
                  description: |-
                    A recorded approval by a role named in the knob register. `reference` points at the reviewed
                    change (a pull request URL, for example), because policy changes only arrive through review.
                  properties:
                    reference:
                      description: "Where the approval was given: a link to the reviewed change."
                      type: string
                    role:
                      description: Approver roles named in the knob register.
                      enum:
                      - Security
                      - PlatformOwner
                      - DataOwner
                      - Compliance
                      - ToolOwner
                      - RiskOwner
                      type: string
                  required:
                  - reference
                  - role
                  type: object
                type: array
              audiences:
                default: []
                description: The audiences the policy may expose.
                items:
                  description: >-
                    One audience a policy may expose, with the most access and the longest token it
                    may have.
                  properties:
                    access:
                      description: "`Write` allows `Read`."
                      enum:
                      - Read
                      - Write
                      type: string
                    endpoints:
                      default: []
                      description: The endpoints, `host:port`, at which the audience may be reached (ADR-0013).
                      items:
                        type: string
                      type: array
                    maxTtlSeconds:
                      description: The longest token lifetime, in seconds.
                      format: int64
                      minimum: 0.0
                      type: integer
                    name:
                      description: The audience.
                      type: string
                  required:
                  - access
                  - maxTtlSeconds
                  - name
                  type: object
                type: array
              egressHosts:
                default: []
                description: "`host:port`, as in `status.maxExposure.egressHosts`."
                items:
                  type: string
                type: array
              maxLeaseSeconds:
                description: The longest lease, in seconds.
                format: int64
                minimum: 0.0
                type: integer
              tools:
                default: []
                description: Tool names.
                items:
                  type: string
                type: array
            required:
            - approvals
            - maxLeaseSeconds
            type: object
        required:
        - spec
        title: ExposureCeiling
        type: object
    served: true
    storage: true
