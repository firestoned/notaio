name: Build

on:
  # Deliberately NO `paths:` filter on `pull_request`. A workflow that never
  # triggers reports no status at all, so a required check would stay pending
  # forever. The path filter lives in `make ci-code-changed` and the `changes`
  # job applies it per job, so a docs-only PR skips the expensive work and
  # still reports.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # A published release builds the version's image, signs and attests it, and
  # attaches the digest-pinned install manifest (ADR-0009).
  release:
    types:
      - published

# Top-level GITHUB_TOKEN is read-only (OpenSSF Scorecard Token-Permissions).
# A job that needs more declares it at the job level.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Every `run:` is a Makefile target (.claude/rules/github-workflows.md), so each
# job runs identically on a laptop: `make lint`, `make test`, and so on.
#
# Not here yet, on purpose:
#   - license-check (SPDX headers): the licence is still marked "assumed" in
#     Cargo.toml and no file carries a header. Add the job with the headers.
#   - image scanning (Grype) and VEX: the follow-ups to ADR-0009.

jobs:
  changes:
    name: 🔀 Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect build-relevant changes
        id: detect
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=$(make ci-code-changed)" >> "$GITHUB_OUTPUT"
          fi

  verify-commits:
    name: 🔐 Verify Signed Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify commits (PR)
        if: github.event_name == 'pull_request'
        uses: firestoned/github-actions/security/verify-signed-commits@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: origin/${{ github.base_ref }}
          verify-mode: pr

      - name: Verify commits (push to main)
        if: github.event_name == 'push'
        uses: firestoned/github-actions/security/verify-signed-commits@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          verify-mode: push

      - name: Verify commits (release)
        if: github.event_name == 'release'
        uses: firestoned/github-actions/security/verify-signed-commits@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          verify-mode: release

  lint:
    name: 🎨 Format + Clippy
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    needs: [changes, verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref, re-pin quarterly)
        with:
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0

      - name: Check formatting
        run: make fmt-check

      - name: Run clippy
        run: make clippy

  test:
    name: 🧪 Test + Generated Files
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    needs: [changes, verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref, re-pin quarterly)

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0

      - name: Run tests
        run: make test

      # deploy/crds and deploy/profiles are generated from the Rust types and
      # must never drift from them.
      - name: Check generated manifests
        run: make manifests-check

      # docs/src/reference is generated from the code (lint rules, knobs,
      # profiles, CRDs, metrics, CLI, environment) and must never drift from it.
      - name: Check generated reference docs
        run: make docs-reference-check

      # notaio lint on the repository's own examples and profiles (ADR-0006).
      - name: Lint example policies
        run: make policy-lint

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check the AIR framework mapping
        run: make air-check

      # The release-only logic, proven on every pull request (ADR-0009).
      - name: Release manifest pins the image by digest
        run: make release-manifest-test

      - name: Release version stamp works
        run: make set-version-test

  security:
    name: 🛡️ Security Vulnerability Scan
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    needs: [changes, verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref, re-pin quarterly)

      - name: Run security scan
        uses: firestoned/github-actions/rust/security-scan@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          cargo-audit-version: "0.22.0"

  cargo-deny:
    name: 🧪 cargo-deny (License + Advisory + Sources)
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    needs: [changes, verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same check as `make deny`; the action brings its own cargo-deny binary.
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          log-level: warn
          command: check

  # ─────────────────────────────────────────────────────────────────────────────
  # Release images and their supply chain (ADR-0009). Pull requests build both
  # binaries and the multi-arch image and push nothing. A push to main and a
  # published release push, sign, SBOM and attest by digest. A release also
  # attaches notaio-<version>.yaml, the install manifest pinned to that digest.
  # ─────────────────────────────────────────────────────────────────────────────
  extract-version:
    name: 🏷️ Extract Version
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    needs: [changes, verify-commits]
    outputs:
      version: ${{ steps.version.outputs.version }}
      short-sha: ${{ steps.version.outputs.short-sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version
        id: version
        uses: ./.github/actions/extract-version
        with:
          workflow-type: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && 'main' || 'release' }}
          pr-number: ${{ github.event.pull_request.number }}
          release-tag: ${{ github.event.release.tag_name }}

  build:
    name: 🦀 Binary - ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    needs: [extract-version]
    strategy:
      fail-fast: false
      matrix:
        # Native runners for each architecture: nothing is cross-compiled.
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The binary reports the release's version; fails if Cargo.toml then disagrees.
      - name: Set the workspace version (release)
        if: github.event_name == 'release'
        run: make set-version VERSION=${{ needs.extract-version.outputs.version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref, re-pin quarterly)

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Embeds the dependency tree in the binary, so the image SBOM lists notaio's crates.
      - name: Install cargo-auditable
        run: make cargo-auditable

      - name: Build notaio
        run: make release-binary

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notaio-linux-${{ matrix.platform.arch }}
          path: target/release/notaio
          if-no-files-found: error
          retention-days: 7

  docker:
    name: 🐳 Image
    runs-on: ubuntu-latest
    needs: [build, extract-version, test]
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage the pre-built binaries for the Dockerfile
        uses: ./.github/actions/prepare-docker-binaries

      - name: Set up Docker (login + buildx)
        uses: firestoned/github-actions/docker/setup-docker@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=sha-${{ needs.extract-version.outputs.short-sha }}
            type=raw,value=main-{{date 'YYYY-MM-DD'}},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},prefix=v,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},prefix=v,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.extract-version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=notaio
          cache-to: type=gha,mode=max,scope=notaio
          sbom: true
          provenance: true

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: this workflow's OIDC identity, no key to hold.
      - name: Cosign sign (keyless, by digest)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.docker_build.outputs.digest }}"

      - name: Image SBOM (CycloneDX)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.docker_build.outputs.digest }}
          format: cyclonedx-json
          output-file: notaio-image.cdx.json
          upload-release-assets: false

      # Fails when the SBOM no longer lists notaio's Rust crates.
      - name: Check the SBOM covers notaio's crates
        if: github.event_name != 'pull_request'
        run: make sbom-check SBOM=notaio-image.cdx.json

      - name: Upload image SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notaio-image-sbom
          path: notaio-image.cdx.json
          if-no-files-found: error

  attest:
    name: 🔏 Attest Image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.docker.outputs.digest }}
          push-to-registry: true

  release-manifest:
    name: 📦 Release Manifest
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [docker, extract-version]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render notaio-<version>.yaml, pinned to the image digest
        run: make release-manifest VERSION=${{ needs.extract-version.outputs.version }} IMAGE_DIGEST=${{ needs.docker.outputs.digest }} RELEASE_DIR=dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign sign the manifest (keyless)
        run: cosign sign-blob --yes --bundle "dist/notaio-${{ needs.extract-version.outputs.version }}.yaml.sigstore.json" "dist/notaio-${{ needs.extract-version.outputs.version }}.yaml"

      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notaio-release-manifest
          path: dist/
          if-no-files-found: error

  upload-release-assets:
    name: 🚀 Release Assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [release-manifest, attest, docker]
    permissions:
      contents: write
    steps:
      - name: Download the manifest and the image SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts

      - name: Collect and checksum
        run: |
          mkdir -p release
          cp artifacts/notaio-release-manifest/* artifacts/notaio-image-sbom/* release/
          ( cd release && sha256sum ./* > checksums.sha256 )
          ls -lh release

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
