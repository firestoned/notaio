# Download the per-arch notaio-linux-* build artifacts and stage them at
# binaries/<arch>/notaio, the layout the Dockerfile COPYs from, so the multi-arch
# image build never compiles anything (ADR-0009). Ported from banlieue.
name: Prepare Docker binaries
description: Stage pre-built notaio binaries at binaries/<arch>/ for the Dockerfile.

runs:
  using: composite
  steps:
    - name: Download binary artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: notaio-linux-*
        path: ./artifacts

    - name: Stage binaries
      shell: bash
      run: |
        set -euo pipefail
        for arch in amd64 arm64; do
          mkdir -p "binaries/${arch}"
          cp "artifacts/notaio-linux-${arch}/notaio" "binaries/${arch}/notaio"
          chmod +x "binaries/${arch}/notaio"
        done
        ls -lh binaries/*/notaio
