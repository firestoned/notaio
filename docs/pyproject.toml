[tool.poetry]
name = "notaio-docs"
version = "0.1.0"
description = "Documentation dependencies for notaio, the AgentSandbox policy compiler"
authors = ["Erick Bourgeois <erick@jeb.ca>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"

# Core MkDocs, pinned to 1.x to avoid the breaking changes in 2.0.
# See: https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/
mkdocs = ">=1.6.0,<2.0"
mkdocs-material = "^9.5.0"

# MkDocs plugins
mkdocs-git-revision-date-localized-plugin = "^1.2.4"

# Markdown extensions (pymdownx.snippets pulls the canonical docs into the site)
pymdown-extensions = ">=11.0.1,<13.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
