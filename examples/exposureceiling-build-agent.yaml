# The approved maximum exposure of SandboxPolicy build-agent (ADR-0007), which includes git-read
# and package-mirror (ADR-0023). It bounds the composite's effective content: what build-agent
# declares and what its includes contribute. A change to an include that goes past it stops
# build-agent's re-signing (L014) until this is widened, with its own Security approval.
apiVersion: sandbox.firestoned.io/v1alpha2
kind: ExposureCeiling
metadata:
  name: build-agent
  namespace: sandboxes
spec:
  audiences:
    - name: internal-git
      access: Read
      maxTtlSeconds: 300
      endpoints: ["git.foo.io:443"]
      dataScope: Internal
  egressHosts: ["packages.foo.io:443"]
  tools: []
  # Standard is K7.3 R1: the lease defaults to 8 hours.
  maxLeaseSeconds: 28800
  approvals:
    - role: Security
      reference: https://github.com/firestoned/notaio/pull/1
