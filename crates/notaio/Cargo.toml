[package]
name = "notaio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "server", "tokio"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.0.0", features = ["runtime", "derive"] }
prometheus-client = "0.25.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
sandboxpolicy-api = { path = "../sandboxpolicy-api" }
sandboxpolicy-bundle = { path = "../sandboxpolicy-bundle" }
sandboxpolicy-core = { path = "../sandboxpolicy-core" }
sandboxpolicy-types = { path = "../sandboxpolicy-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
# The e2e suites reach the controller's listener through a port-forward (ADR-0010).
kube = { version = "4.0.0", features = ["runtime", "derive", "ws"] }
tokio = { version = "1.53.1", features = ["io-util"] }

[lints]
workspace = true
