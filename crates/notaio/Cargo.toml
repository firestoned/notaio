[package]
name = "notaio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
futures = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.0.0", features = ["runtime", "derive"] }
sandboxpolicy-api = { version = "0.0.1", path = "../sandboxpolicy-api" }
sandboxpolicy-bundle = { version = "0.0.1", path = "../sandboxpolicy-bundle" }
sandboxpolicy-core = { version = "0.0.1", path = "../sandboxpolicy-core" }
sandboxpolicy-types = { version = "0.0.1", path = "../sandboxpolicy-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[lints]
workspace = true
