[package]
name = "sandboxpolicy-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
schemars = { version = "1.2.2", features = ["chrono04"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
# JSON Schema derives, for the CRDs (sandboxpolicy-api). Off by default, so a consumer of the bundle
# crate, such as mediatore-guest running as root in every VM, does not compile schemars (ADR-0014).
schema = ["dep:schemars"]

[lints]
workspace = true
