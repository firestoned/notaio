[package]
name = "sandboxpolicy-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
jiff = { version = "1.0.1", default-features = false, features = ["std", "serde"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = { version = "5.2.0", default-features = false, features = ["derive"] }
sandboxpolicy-types = { path = "../sandboxpolicy-types", features = ["schema"] }
schemars = { version = "1.2.3", features = ["jiff02"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
