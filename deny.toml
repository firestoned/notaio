# cargo-deny configuration. The licence list was derived from `cargo metadata` of the current
# dependency tree. Not yet run under cargo-deny itself.
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# Permissive and foundation-friendly only. No copyleft, no source-available (BUSL, SSPL, Elastic),
# no AGPL. Dual-licensed crates are accepted when one permissive option exists.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
